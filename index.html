<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JS Event Playground</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>🎮 JavaScript Fun Zone</h1>

  <!-- Event Handling -->
  <button id="clickBtn">Click Me!</button>
  <div id="hoverBox">Hover over me!</div>
  <input type="text" id="keypressInput" placeholder="Type something..." />
  <button id="secretBtn">Double Click Me</button>

  <!-- Interactive Elements -->
  <button id="changeBtn">Change My Color</button>
  <div class="gallery">
    <img id="galleryImg" src="https://via.placeholder.com/200" alt="Gallery Image">
    <button id="nextImg">Next Image</button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tabBtn" data-tab="1">Tab 1</button>
    <button class="tabBtn" data-tab="2">Tab 2</button>
    <div class="tabContent" id="tab1">Content for Tab 1</div>
    <div class="tabContent" id="tab2">Content for Tab 2</div>
  </div>

  <!-- Form Validation -->
  <form id="signupForm">
    <input type="text" id="name" placeholder="Name" required />
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Password" required />
    <span id="feedback"></span>
    <button type="submit">Submit</button>
  </form>

  <script src="script.js"></script>
</body>
</html>
